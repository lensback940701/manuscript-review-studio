name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -B -m unittest discover -s tests -p "test_*.py"
      - name: Retained adversarial contract
        run: python -B scripts/run_adversarial_probes_rc2_0.py
      - name: Current adversarial contract
        run: python -B scripts/run_adversarial_probes_rc2_1.py

